# Render Blueprint — Ahenk backend (Express + Socket.io + Prisma)
# Ön yüz Vercel'de, veritabanı Supabase'de kalır.
services:
  - type: web
    name: ahenk-server
    runtime: node
    plan: free
    region: frankfurt # Supabase eu-central-1 ile aynı bölge
    buildCommand: npm ci --workspace=server --include=dev && npm run build --workspace=server
    startCommand: npm start --workspace=server
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false # Supabase bağlantı adresi (server/.env ile aynı)
      - key: CLIENT_URL
        sync: false # Vercel adresi; birden fazlaysa virgülle ayır
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
